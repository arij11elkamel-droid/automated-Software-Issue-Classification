version: '3'
services:
  flask_backend:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - monitoring_network
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
        - ./database.db:/app/database.db
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_network
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_network
    ports:
      - "3000:3000"

networks:
  monitoring_network:
    driver: bridge

volumes:
  grafana_data:
